# Exports every diagrams/src/*.drawio to images/diagrams/*.png and commits the result,
# so Mintlify always has the PNG that the docs pages embed.
name: Export diagrams
on:
  push:
    branches: ["**"]
    paths:
      - "diagrams/src/**.drawio"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: export-diagrams
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install draw.io desktop (pinned)
        env:
          DRAWIO_VERSION: "26.0.9"
        run: |
          wget -q "https://github.com/jgraph/drawio-desktop/releases/download/v${DRAWIO_VERSION}/drawio-amd64-${DRAWIO_VERSION}.deb"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-roboto "./drawio-amd64-${DRAWIO_VERSION}.deb"
      - name: Export PNGs with draw.io
        run: |
          mkdir -p images/diagrams
          for f in diagrams/src/*.drawio; do
            n=$(basename "$f" .drawio)
            xvfb-run -a drawio --no-sandbox -x -f png -s 2 -b 20 --crop \
              -o "images/diagrams/$n.png" "$f"
            test -s "images/diagrams/$n.png" || { echo "Export failed for $f"; exit 1; }
          done
      - name: Commit PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/diagrams
          git diff --cached --quiet || git commit -m "chore: export diagram PNGs" && git push
